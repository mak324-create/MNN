name: Build MNN Chat APK

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build-mnn-chat.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout MNN
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build MNN native libs (arm64)
        working-directory: project/android
        run: |
          mkdir -p build_64
          cd build_64
          ../build_64.sh "-DMNN_LOW_MEMORY=true \
            -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true \
            -DMNN_BUILD_LLM=true \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=true \
            -DMNN_ARM82=true \
            -DMNN_OPENCL=true"
          make install

      - name: Build APK
        working-directory: apps/Android/MnnLlmChat
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mnn-chat-debug-apk
          path: |
            apps/Android/MnnLlmChat/app/build/outputs/apk/debug/*.apk
            apps/Android/MnnLlmChat/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

