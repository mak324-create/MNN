name: Build MNN Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/build-mnn-chat.yml'

permissions:
  contents: read

concurrency:
  group: build-mnn-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Env info
        run: |
          echo "===== MNN diffusion condition in CMakeLists ====="
          grep -n 'MNN_BUILD_DIFFUSION AND' CMakeLists.txt || true
          echo "===== mnnllmapp CMakeLists target_link_libraries ====="
          CPP="apps/Android/MnnLlmChat/app/src/main/cpp"
          grep -nE 'target_link_libraries|MNN_Diffusion' "$CPP/CMakeLists.txt" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect required NDK version
        id: ndk
        run: |
          f=apps/Android/MnnLlmChat/app/build.gradle
          v=$(grep -oP 'ndkVersion\s+"\K[^"]+' "$f" 2>/dev/null || true)
          [ -z "$v" ] && v=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' "$f" 2>/dev/null || true)
          echo "required=$v" >> "$GITHUB_OUTPUT"
          echo "Detected NDK: '$v'"

      - name: Locate sdkmanager
        id: sdk
        run: |
          SM="$(command -v sdkmanager || true)"
          [ -z "$SM" ] && SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ ! -x "$SM" ] && SM="$(find "$ANDROID_HOME" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -n1)"
          [ -z "$SM" ] && { echo "sdkmanager not found"; exit 1; }
          echo "path=$SM" >> "$GITHUB_OUTPUT"
          echo "Using: $SM"

      - name: Install NDK + CMake 3.22.1
        run: |
          set -e
          SM="${{ steps.sdk.outputs.path }}"
          REQ="${{ steps.ndk.outputs.required }}"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          [ -n "$REQ" ] && { "$SM" --install "ndk;$REQ" || echo "WARN: NDK $REQ install failed"; }
          "$SM" --install "cmake;3.22.1" || echo "WARN: cmake install failed"
          if [ -n "$REQ" ] && [ -d "$ANDROID_HOME/ndk/$REQ" ]; then
            CHOSEN="$ANDROID_HOME/ndk/$REQ"
          else
            CHOSEN="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n1)"
          fi
          [ -z "$CHOSEN" ] && { echo "no NDK"; exit 1; }
          echo "ANDROID_NDK_HOME=$CHOSEN" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$CHOSEN" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$CHOSEN"      >> "$GITHUB_ENV"
          echo "Selected NDK: $CHOSEN"

      - name: Build MNN native libs (diffusion baked into libMNN.so)
        working-directory: project/android
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          cmake --version
          rm -rf build_64
          mkdir -p build_64
          cd build_64
          cmake ../../.. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/install" \
            -DMNN_BUILD_FOR_ANDROID_COMMAND=true \
            -DMNN_LOW_MEMORY=true \
            -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true \
            -DMNN_BUILD_LLM=true \
            -DMNN_BUILD_EXPRESS=true \
            -DMNN_BUILD_DIFFUSION=ON \
            -DMNN_BUILD_OPENCV=ON \
            -DMNN_IMGCODECS=ON \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=true \
            -DMNN_ARM82=true \
            -DMNN_OPENCL=false \
            -DMNN_SEP_BUILD=false
          echo "=== VERIFY diffusion block triggered ==="
          grep -E 'MNN_BUILD_DIFFUSION|diffusion' CMakeCache.txt | head -n 30 || true
          make -j"$(nproc)"
          make install || true
          echo "=== .so files ==="
          find . -name '*.so' -type f | sort

      - name: Verify createDiffusion is inside libMNN.so
        working-directory: project/android/build_64
        run: |
          NM="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          LIB="lib/libMNN.so"
          [ ! -f "$LIB" ] && LIB="$(find . -name 'libMNN.so' -type f | head -n1)"
          [ -z "$LIB" ] && { echo "ERROR: libMNN.so not built"; exit 1; }
          echo "Inspecting: $LIB"
          echo "=== createDiffusion / MNN::DIFFUSION symbols (must be > 0) ==="
          "$NM" -D --defined-only "$LIB" 2>/dev/null | grep -E 'createDiffusion|MNN::DIFFUSION' | head -n 15 || true
          CNT=$("$NM" -D --defined-only "$LIB" 2>/dev/null | grep -cE 'createDiffusion|MNN::DIFFUSION' || echo 0)
          echo "Diffusion symbol count: $CNT"
          if [ "$CNT" = "0" ]; then
            echo "ERROR: no diffusion symbols in libMNN.so — condition MNN_BUILD_DIFFUSION AND MNN_BUILD_OPENCV AND MNN_IMGCODECS not met"
            grep -E 'MNN_BUILD_DIFFUSION|MNN_BUILD_OPENCV|MNN_IMGCODECS' CMakeCache.txt || true
            exit 1
          fi

      - name: Normalize lib locations
        working-directory: project/android
        run: |
          set -e
          mkdir -p build_64/lib build_64/install/lib
          find build_64 -name '*.so' -type f -exec cp -n -v {} build_64/lib/ \;
          find build_64 -name '*.so' -type f -exec cp -n -v {} build_64/install/lib/ \;
          ls -la build_64/lib/

      - name: Remove MNN_Diffusion links from mnnllmapp (undo v16-v18 patch)
        run: |
          set -e
          CMAKE="apps/Android/MnnLlmChat/app/src/main/cpp/CMakeLists.txt"
          [ ! -f "$CMAKE" ] && { echo "ERROR: $CMAKE not found"; exit 1; }
          echo "=== Before ==="
          grep -nE 'target_link_libraries|MNN_Diffusion' "$CMAKE" || true
          python3 - "$CMAKE" <<'PYEOF'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          # убираем MNN_Diffusion из любых target_link_libraries и одиночных строк
          s2 = re.sub(r'^\s*MNN_Diffusion\s*$', '', s, flags=re.M)
          s2 = re.sub(r'\bMNN_Diffusion\b', '', s2)
          # удалить пустые строки, которые могли появиться
          s2 = re.sub(r'\n{3,}', '\n\n', s2)
          if s2 != s:
              open(p, 'w').write(s2)
              print("Patched: removed MNN_Diffusion references")
          else:
              print("No MNN_Diffusion references — nothing to do")
          PYEOF
          echo "=== After ==="
          grep -nE 'target_link_libraries|MNN_Diffusion' "$CMAKE" || true

      - name: Copy MNN .so into jniLibs
        run: |
          set -e
          mkdir -p apps/Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a
          find project/android/build_64 -name "*.so" -type f -exec cp -v {} apps/Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a/ \;
          ls -la apps/Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a/ || true

      - name: Build APK (googleplay debug)
        working-directory: apps/Android/MnnLlmChat
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleGoogleplayDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Find produced APKs
        if: always()
        run: |
          echo "=== All APKs ==="
          find apps/Android/MnnLlmChat/app/build/outputs -name '*.apk' -type f 2>/dev/null | sort || true

      - name: Show Gradle log tail on failure
        if: failure()
        run: |
          tail -n 150 /tmp/gradle-build.log || true
          echo "=== undefined symbols ==="
          grep -E 'undefined symbol|error:' /tmp/gradle-build.log | tail -n 30 || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnn-chat-googleplay-debug
          path: apps/Android/MnnLlmChat/app/build/outputs/apk/googleplay/debug/*.apk
          if-no-files-found: warn

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: warn