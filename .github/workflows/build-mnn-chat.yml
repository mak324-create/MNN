name: Build MNN Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/build-mnn-chat.yml'

permissions:
  contents: read

concurrency:
  group: build-mnn-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Env info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager || true
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true
          ls "$ANDROID_HOME/cmake" 2>/dev/null || true
          ls project/android 2>/dev/null || true
          ls apps/Android/MnnLlmChat 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect required NDK version
        id: ndk
        run: |
          f=apps/Android/MnnLlmChat/app/build.gradle
          v=$(grep -oP 'ndkVersion\s+"\K[^"]+' "$f" 2>/dev/null || true)
          [ -z "$v" ] && v=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' "$f" 2>/dev/null || true)
          echo "required=$v" >> "$GITHUB_OUTPUT"
          echo "Detected NDK: '$v'"

      - name: Locate sdkmanager
        id: sdk
        run: |
          SM="$(command -v sdkmanager || true)"
          [ -z "$SM" ] && SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ ! -x "$SM" ] && SM="$(find "$ANDROID_HOME" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -n1)"
          [ -z "$SM" ] && { echo "sdkmanager not found"; exit 1; }
          echo "path=$SM" >> "$GITHUB_OUTPUT"
          echo "Using: $SM"

      - name: Install NDK + CMake 3.18.1
        run: |
          set -e
          SM="${{ steps.sdk.outputs.path }}"
          REQ="${{ steps.ndk.outputs.required }}"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          [ -n "$REQ" ] && { "$SM" --install "ndk;$REQ" || echo "WARN: NDK $REQ install failed"; }
          # CMake 3.18.1: PRE_BUILD на OBJECT library — ещё warning, не error.
          # 3.20+ делает это ошибкой, и MNN 3.6.2 собираться перестаёт.
          "$SM" --install "cmake;3.18.1" || echo "WARN: cmake 3.18.1 install failed"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true
          ls "$ANDROID_HOME/cmake" 2>/dev/null || true
          if [ -n "$REQ" ] && [ -d "$ANDROID_HOME/ndk/$REQ" ]; then
            CHOSEN="$ANDROID_HOME/ndk/$REQ"
          else
            CHOSEN="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n1)"
          fi
          [ -z "$CHOSEN" ] && { echo "no NDK"; exit 1; }
          echo "ANDROID_NDK_HOME=$CHOSEN" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$CHOSEN" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$CHOSEN"      >> "$GITHUB_ENV"
          echo "Selected NDK: $CHOSEN"

          CMAKE_BIN="$ANDROID_HOME/cmake/3.18.1/bin/cmake"
          if [ ! -x "$CMAKE_BIN" ]; then echo "ERROR: cmake 3.18.1 not found at $CMAKE_BIN"; exit 1; fi
          echo "SDK CMake 3.18.1: $CMAKE_BIN"
          "$CMAKE_BIN" --version

      - name: Build MNN native libs (CMake 3.18.1)
        working-directory: project/android
        run: |
          set -e
          # Форсим CMake 3.18.1 — на 3.20+ add_custom_command(TARGET <OBJECT> PRE_BUILD)
          # это ошибка, и MNN 3.6.2 не собирается.
          export PATH="$ANDROID_HOME/cmake/3.18.1/bin:$PATH"
          echo "Which cmake: $(command -v cmake)"
          cmake --version

          rm -rf build_64
          mkdir -p build_64
          cd build_64
          cmake ../../.. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/install" \
            -DMNN_LOW_MEMORY=true \
            -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true \
            -DMNN_BUILD_LLM=true \
            -DMNN_BUILD_EXPRESS=true \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=true \
            -DMNN_ARM82=true \
            -DMNN_OPENCL=false \
            -DMNN_SEP_BUILD=false
          make -j"$(nproc)"
          make install || true
          echo "=== .so under build_64/lib ==="
          ls -la lib/ 2>/dev/null || true
          echo "=== .so under build_64/install/lib ==="
          ls -la install/lib/ 2>/dev/null || true

      - name: Verify libMNN.so contains Express symbols
        working-directory: project/android/build_64
        run: |
          set -e
          NM="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          LIB="lib/libMNN.so"
          [ ! -f "$LIB" ] && LIB="$(find . -name 'libMNN.so' -type f | head -n1)"
          [ -z "$LIB" ] && { echo "ERROR: libMNN.so not built"; exit 1; }
          echo "Inspecting: $LIB"
          echo "--- Express symbols count ---"
          "$NM" -D --defined-only "$LIB" 2>/dev/null | grep -c 'MNN::Express' || echo 0
          echo "--- Sample Express symbols ---"
          "$NM" -D --defined-only "$LIB" 2>/dev/null | grep 'MNN::Express' | head -n 10 || true

      - name: Normalize lib locations
        working-directory: project/android
        run: |
          set -e
          mkdir -p build_64/lib build_64/install/lib
          find build_64 -name '*.so' -type f -exec cp -n -v {} build_64/lib/ \;
          find build_64 -name '*.so' -type f -exec cp -n -v {} build_64/install/lib/ \;
          echo "--- build_64/lib ---"
          ls -la build_64/lib/
          echo "--- build_64/install/lib ---"
          ls -la build_64/install/lib/
          [ -f build_64/lib/libMNN.so ]

      - name: Copy MNN .so into jniLibs
        run: |
          set -e
          mkdir -p apps/Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a
          find project/android/build_64 -name "*.so" -exec cp -v {} apps/Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a/ \;
          ls -la apps/Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a/ || true

      - name: Build APK
        working-directory: apps/Android/MnnLlmChat
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnn-chat-debug-apk
          path: |
            apps/Android/MnnLlmChat/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn