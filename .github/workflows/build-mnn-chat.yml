name: Build MNN Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/build-mnn-chat.yml'

permissions:
  contents: read

concurrency:
  group: build-mnn-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Env info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager || true
          which cmake || true
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true
          ls "$ANDROID_HOME/cmake" 2>/dev/null || true
          ls project/android 2>/dev/null || true
          ls apps/Android/MnnLlmChat 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect required NDK version
        id: ndk
        run: |
          v=$(grep -oP 'ndkVersion\s+"\K[^"]+' apps/Android/MnnLlmChat/app/build.gradle || true)
          if [ -z "$v" ]; then v=$(grep -oP 'ndkVersion\s+=\s+"\K[^"]+' apps/Android/MnnLlmChat/app/build.gradle || true); fi
          echo "required=$v" >> "$GITHUB_OUTPUT"
          echo "Detected NDK: '$v'"

      - name: Install NDK + CMake (if needed)
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          if [ -n "${{ steps.ndk.outputs.required }}" ]; then
            sdkmanager --install "ndk;${{ steps.ndk.outputs.required }}" >/dev/null
          fi
          sdkmanager --install "cmake;3.22.1" >/dev/null
          sdkmanager --list_installed | head -n 60

      - name: Build MNN native libs (arm64)
        working-directory: project/android
        run: |
          set -e
          chmod +x build_64.sh
          mkdir -p build_64
          cd build_64
          ../build_64.sh "-DMNN_LOW_MEMORY=true \
            -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true \
            -DMNN_BUILD_LLM=true \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=true \
            -DMNN_ARM82=true \
            -DMNN_OPENCL=true"
          make -j"$(nproc)" install

      - name: Copy MNN .so into jniLibs
        run: |
          set -e
          mkdir -p apps/Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a
          find project/android/build_64 -name "*.so" -exec cp -v {} apps/Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a/ \;

      - name: Build APK
        working-directory: apps/Android/MnnLlmChat
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnn-chat-debug-apk
          path: |
            apps/Android/MnnLlmChat/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn