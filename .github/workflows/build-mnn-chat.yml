name: Build MNN Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/build-mnn-chat.yml'

permissions:
  contents: read

concurrency:
  group: build-mnn-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Env info — diffusion and mnnllmapp
        run: |
          echo "===== Root CMakeLists: DIFFUSION ====="
          grep -nE 'DIFFUSION' CMakeLists.txt | head -n 30 || true
          echo "===== diffusion engine sources ====="
          find transformers/diffusion -maxdepth 3 -type d 2>/dev/null | head -n 30 || true
          echo "===== mnnllmapp CMakeLists (full) ====="
          CPP="apps/Android/MnnLlmChat/app/src/main/cpp"
          cat "$CPP/CMakeLists.txt" 2>/dev/null | head -n 200 || true
          echo "===== cpp sources ====="
          ls -la "$CPP" 2>/dev/null || true
          echo "===== build.gradle flavor/buildTypes ====="
          sed -n '/buildTypes/,/^}/p' apps/Android/MnnLlmChat/app/build.gradle | head -n 80 || true
          sed -n '/productFlavors/,/^}/p' apps/Android/MnnLlmChat/app/build.gradle | head -n 80 || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect required NDK version
        id: ndk
        run: |
          f=apps/Android/MnnLlmChat/app/build.gradle
          v=$(grep -oP 'ndkVersion\s+"\K[^"]+' "$f" 2>/dev/null || true)
          [ -z "$v" ] && v=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' "$f" 2>/dev/null || true)
          echo "required=$v" >> "$GITHUB_OUTPUT"
          echo "Detected NDK: '$v'"

      - name: Locate sdkmanager
        id: sdk
        run: |
          SM="$(command -v sdkmanager || true)"
          [ -z "$SM" ] && SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ ! -x "$SM" ] && SM="$(find "$ANDROID_HOME" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -n1)"
          [ -z "$SM" ] && { echo "sdkmanager not found"; exit 1; }
          echo "path=$SM" >> "$GITHUB_OUTPUT"
          echo "Using: $SM"

      - name: Install NDK + CMake 3.22.1
        run: |
          set -e
          SM="${{ steps.sdk.outputs.path }}"
          REQ="${{ steps.ndk.outputs.required }}"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          [ -n "$REQ" ] && { "$SM" --install "ndk;$REQ" || echo "WARN: NDK $REQ install failed"; }
          "$SM" --install "cmake;3.22.1" || echo "WARN: cmake install failed"
          if [ -n "$REQ" ] && [ -d "$ANDROID_HOME/ndk/$REQ" ]; then
            CHOSEN="$ANDROID_HOME/ndk/$REQ"
          else
            CHOSEN="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n1)"
          fi
          [ -z "$CHOSEN" ] && { echo "no NDK"; exit 1; }
          echo "ANDROID_NDK_HOME=$CHOSEN" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$CHOSEN" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$CHOSEN"      >> "$GITHUB_ENV"
          echo "Selected NDK: $CHOSEN"

      - name: Build MNN native libs (with diffusion)
        working-directory: project/android
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          cmake --version
          rm -rf build_64
          mkdir -p build_64
          cd build_64
          cmake ../../.. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/install" \
            -DMNN_BUILD_FOR_ANDROID_COMMAND=true \
            -DMNN_LOW_MEMORY=true \
            -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true \
            -DMNN_BUILD_LLM=true \
            -DMNN_BUILD_EXPRESS=true \
            -DMNN_BUILD_DIFFUSION=ON \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=true \
            -DMNN_ARM82=true \
            -DMNN_OPENCL=false \
            -DMNN_SEP_BUILD=false
          make -j"$(nproc)"
          make install || true
          echo "=== ALL .so under build_64 ==="
          find . -name '*.so' -type f | sort

      - name: Inspect diffusion and Express symbols
        working-directory: project/android/build_64
        run: |
          NM="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          echo "=== libMNN_Diffusion present? ==="
          find . -name 'libMNN_Diffusion*' -o -name 'lib*iffusion*.so' 2>/dev/null | sort || echo "(no diffusion .so)"
          echo "=== symbol counts per .so ==="
          for so in $(find . install -name '*.so' -type f 2>/dev/null | sort -u); do
            diff_cnt=$("$NM" -D --defined-only "$so" 2>/dev/null | grep -cE 'createDiffusion|MNN::DIFFUSION' || echo 0)
            expr_cnt=$("$NM" -D --defined-only "$so" 2>/dev/null | grep -c 'MNN::Express' || echo 0)
            printf "%-60s diffusion=%s express=%s\n" "$so" "$diff_cnt" "$expr_cnt"
          done

      - name: Normalize lib locations
        working-directory: project/android
        run: |
          set -e
          mkdir -p build_64/lib build_64/install/lib
          find build_64 -name '*.so' -type f -exec cp -n -v {} build_64/lib/ \;
          find build_64 -name '*.so' -type f -exec cp -n -v {} build_64/install/lib/ \;
          ls -la build_64/lib/

      - name: Patch mnnllmapp to link MNN_Diffusion
        run: |
          set -e
          CMAKE="apps/Android/MnnLlmChat/app/src/main/cpp/CMakeLists.txt"
          [ ! -f "$CMAKE" ] && { echo "ERROR: $CMAKE not found"; exit 1; }

          python3 - "$CMAKE" <<'PYEOF'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()

          if re.search(r'MNN_Diffusion', s):
              print("Already contains MNN_Diffusion — nothing to do")
              sys.exit(0)

          # Патчим ЛЮБОЙ target_link_libraries(...), на случай если target называется ${CMAKE_PROJECT_NAME}
          pat = re.compile(r'(target_link_libraries\s*\(\s*[^)\s]+)([^)]*)(\))', re.S)
          def repl(m):
              return m.group(1) + m.group(2).rstrip() + '\n    MNN_Diffusion\n' + m.group(3)
          s2, n = pat.subn(repl, s, count=1)
          if n:
              open(p, 'w').write(s2)
              print("Patched existing target_link_libraries: added MNN_Diffusion")
              sys.exit(0)

          # Fallback: добавляем отдельный блок с явным MNN_Diffusion
          s2 = s.rstrip() + '\n\n# [patched] link diffusion\n'
          s2 += 'target_link_libraries(${CMAKE_PROJECT_NAME} MNN_Diffusion)\n'
          open(p, 'w').write(s2)
          print("Appended target_link_libraries(${CMAKE_PROJECT_NAME} MNN_Diffusion)")
          PYEOF

          echo "=== After ==="
          grep -nE 'target_link_libraries|MNN_Diffusion' "$CMAKE" || true

      - name: Copy MNN .so into jniLibs
        run: |
          set -e
          mkdir -p apps/Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a
          find project/android/build_64 -name "*.so" -type f -exec cp -v {} apps/Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a/ \;
          ls -la apps/Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a/ || true

      - name: Build APK (googleplay debug)
        working-directory: apps/Android/MnnLlmChat
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleGoogleplayDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Build APK (standard debug)
        working-directory: apps/Android/MnnLlmChat
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleStandardDebug --stacktrace --no-daemon 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Find produced APKs
        if: always()
        run: |
          echo "=== All APKs ==="
          find apps/Android/MnnLlmChat/app/build/outputs -name '*.apk' -type f 2>/dev/null | sort || true
          echo "=== Dirs in outputs/apk ==="
          find apps/Android/MnnLlmChat/app/build/outputs/apk -maxdepth 3 -type d 2>/dev/null | sort || true

      - name: Show Gradle log tail on failure
        if: failure()
        run: |
          echo "=== Last 200 lines of /tmp/gradle-build.log ==="
          tail -n 200 /tmp/gradle-build.log || true
          echo "=== undefined symbols ==="
          grep -E 'undefined symbol|error:' /tmp/gradle-build.log | tail -n 50 || true

      - name: Upload APK (googleplay)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnn-chat-googleplay-debug
          path: apps/Android/MnnLlmChat/app/build/outputs/apk/googleplay/debug/*.apk
          if-no-files-found: warn

      - name: Upload APK (standard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnn-chat-standard-debug
          path: apps/Android/MnnLlmChat/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: warn

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: warn